[project]
name = "ihsg-quant-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "openpyxl>=3.1",
  "redis>=5.0",
  "rq>=1.16",
  "apscheduler>=3.10",
  "polars>=1.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "yfinance>=0.2.40",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "pyright>=1.1",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
"app/interfaces/api/routes/*.py" = ["B008"]
"tests/*.py" = ["E402", "F811"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["app"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
